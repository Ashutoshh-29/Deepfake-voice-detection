<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deepfake Voice Detection{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background: #EEF1F5; color: #12151C; }
    .navbar { background: #fff; border-bottom: 1px solid #D6DCE5; }
    .brand, h1, h2, .verdict { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
    .brand { font-weight: 700; color: #12151C; text-decoration: none; }
    .panel { background: #fff; border: 1px solid #D6DCE5; padding: 2rem; }
    .text-real { color: #1F9D74; }
    .text-fake { color: #D65F4C; }
    .bar-real { background-color: #1F9D74; }
    .bar-fake { background-color: #D65F4C; }
    .badge-real { background-color: #1F9D74; }
    .badge-fake { background-color: #D65F4C; }
    footer { color: #5B6472; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="navbar py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand fs-5" href="/">voicecheck<span class="text-secondary fw-normal">.detect</span></a>
      <div class="d-flex gap-4">
        <a class="text-decoration-none text-dark" href="/">Detect</a>
        <a class="text-decoration-none text-dark" href="/history">History</a>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 860px;">
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4" style="max-width: 860px;">
    Deepfake Voice Detection System &middot; BCA Mini Project &middot; Not a forensic tool.
  </footer>
</body>
</html>
